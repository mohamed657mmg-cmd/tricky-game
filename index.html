<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TRiCKY - لعبة الفخاخ</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090d18;font-family:Arial,sans-serif;touch-action:none}
#game{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 20%,#303b5d 0,#1c2439 38%,#0d1220 100%)}
.stars{position:absolute;inset:0;opacity:.45;background-image:radial-gradient(circle,#fff 1px,transparent 1px),radial-gradient(circle,#fff 1px,transparent 1px);background-size:90px 90px,130px 130px;background-position:10px 20px,50px 70px}
.moon{position:absolute;width:90px;height:90px;border-radius:50%;background:#ffe8a3;box-shadow:0 0 35px #ffe8a366;top:90px;left:12%}
.top{position:absolute;top:15px;left:15px;right:15px;height:58px;display:flex;align-items:center;justify-content:space-between;z-index:50;direction:ltr}
.logo{font-size:27px;font-weight:900;color:white;letter-spacing:2px}.logo span{color:#ffcc4d}
.level{padding:10px 17px;border-radius:18px;background:#ffffff18;border:1px solid #ffffff35;backdrop-filter:blur(10px);color:white;font-weight:bold}
#camera{position:absolute;left:0;top:0;height:100%;width:100%}
#world{position:absolute;width:2600px;height:100%;left:0;top:0;will-change:transform}
.platform{position:absolute;background:linear-gradient(#596782,#343d55);border-top:6px solid #7786a5;border-radius:7px;box-shadow:0 10px 20px #0006;transition:transform.5s, opacity.5s}
.platform.fake{border-top-color:#ff4d72; animation: shake 0.3s infinite}
.platform.falling{transform:translateY(400px) rotate(15deg);opacity:0}
@keyframes shake{0%,100%{transform:translateX(0)}50%{transform:translateX(2px)}}
.spike{position:absolute;width:0;height:0;border-left:17px solid transparent;border-right:17px solid transparent;border-bottom:34px solid #ff4d72;filter:drop-shadow(0 5px 4px #0008)}
.coin{position:absolute;width:28px;height:28px;border-radius:50%;background:#ffd34e;border:4px solid #ffef9a;box-shadow:0 0 20px #ffd34e99;display:flex;align-items:center;justify-content:center;font-size:14px;transition:transform.2s}
.coin.collected{transform:scale(0)}
.door{position:absolute;width:65px;height:88px;border-radius:12px 12px 4px 4px;background:linear-gradient(135deg,#55f59a,#1cae67);border:5px solid #087342;box-shadow:0 0 25px #35e98b55}
.door.fake-door{background:linear-gradient(135deg,#ff7b7b,#c0392b);border-color:#7a1f1f;opacity:0.7}
#player{position:absolute;width:42px;height:50px;border-radius:11px 11px 8px 8px;background:linear-gradient(135deg,#55ddff,#28a8dc);border:3px solid #8cecff;box-shadow:0 7px 0 #11739d,0 0 20px #36cfff55;z-index:20;transition:transform.1s}
#player:before{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:#111827;left:8px;top:13px;box-shadow:17px 0 #111827}
.controls{position:absolute;bottom:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:end;direction:ltr;z-index:60}
.move{display:flex;gap:12px}
.btn{width:67px;height:67px;border-radius:20px;border:1px solid #ffffff35;background:#182033dd;color:white;font-size:29px;font-weight:bold;box-shadow:0 7px 20px #0008;backdrop-filter:blur(10px)}
.btn:active{transform:scale(.91)}
.jump{width:78px;height:78px;border-radius:50%;background:#ffcc4d;color:#111827;border:none;box-shadow:0 7px 0 #b47d14,0 12px 25px #0008}
#message{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:100;background:#050812d9;backdrop-filter:blur(7px)}
.card{width:min(88%,390px);padding:30px 25px;border-radius:25px;background:#171e31;border:1px solid #ffffff25;text-align:center}
.card h1{margin:0 0 10px;font-size:32px;color:white}
.card p{color:#c6cede;line-height:1.7}
.card button{border:0;padding:14px 30px;border-radius:14px;background:#ffcc4d;color:#111827;font-weight:bold;font-size:17px;margin-top:10px}
#start{position:absolute;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:#080c17e8;backdrop-filter:blur(8px)}
.startCard{text-align:center;width:min(90%,420px)}
.bigLogo{font-size:55px;font-weight:1000;color:white}.bigLogo span{color:#ffcc4d}
.subtitle{color:#c9d0df;margin:8px 0 25px;font-size:17px}
.startBtn{width:85%;border:0;padding:17px;border-radius:17px;background:#ffcc4d;color:#10131c;font-size:20px;font-weight:900;box-shadow:0 7px 0 #b47d14}
.shake{animation:screenShake.3s}
@keyframes screenShake{0%,100%{transform:translate(0)}25%{transform:translate(-8px,5px)}50%{transform:translate(8px,-5px)}75%{transform:translate(-5px,8px)}}
</style>
</head>
<body>
<div id="game">
  <div class="stars"></div><div class="moon"></div>
  <div class="top"><div class="logo">TRiCKY<span>!</span> 😈</div><div class="level">LEVEL <span id="levelNumber">1</span> | 🪙 <span id="coins">0/3</span></div></div>
  <div id="camera"><div id="world">
      <div class="platform" style="left:0;bottom:145px;width:380px;height:42px"></div>
      <div class="platform" style="left:500px;bottom:145px;width:260px;height:42px"></div>
      <div class="platform" id="trollPlatform" style="left:880px;bottom:240px;width:300px;height:42px"></div>
      <div class="platform" style="left:1300px;bottom:145px;width:300px;height:42px"></div>
      <div class="platform" style="left:1720px;bottom:220px;width:400px;height:42px"></div>

      <div class="spike" style="left:310px;bottom:187px"></div><div class="spike" style="left:345px;bottom:187px"></div>
      <div class="spike" id="hiddenSpike1" style="left:600px;bottom:187px;display:none"></div>

      <div class="coin" id="c1" style="left:580px;bottom:210px">🪙</div>
      <div class="coin" id="c2" style="left:1010px;bottom:310px">💀</div>
      <div class="coin" id="c3" style="left:1380px;bottom:215px">🪙</div>

      <div class="door fake-door" id="fakeDoor" style="left:1960px;bottom:262px"></div>
      <div class="door" id="realDoor" style="left:2150px;bottom:262px;display:none"></div>
      <div id="player" style="left:70px;bottom:187px"></div>
  </div></div>
  <div class="controls"><div class="move"><button class="btn" id="left">◀</button><button class="btn" id="right">▶</button></div><button class="btn jump" id="jump">⬆</button></div>
  <div id="start"><div class="startCard"><div class="bigLogo">TRiCKY<span>!</span></div><div class="subtitle">كل حاجة فخ.. حتى العملات! 😈</div><button class="startBtn" onclick="startGame()">▶ ابدأ اللعب</button><div style="margin-top:20px;color:#7f8ba5;font-size:12px">نصيحة: متثقش في العملة اللي شكلها غريب</div></div></div>
  <div id="message"><div class="card"><h1 id="messageTitle"></h1><p id="messageText"></p><button onclick="restart()">🔄 حاول تاني</button></div></div>
</div>
<script>
const player=document.getElementById("player"),world=document.getElementById("world"),game=document.getElementById("game");
let x=70,y=187,vx=0,vy=0,speed=5,jumpPower=14,gravity=0.7,onGround=true,playing=false,dead=false,coins=0,platformTimer=null;
const keys={left:false,right:false};
function btnCtrl(b,k){b.addEventListener("touchstart",e=>{e.preventDefault();keys[k]=true});b.addEventListener("touchend",e=>{e.preventDefault();keys[k]=false});b.addEventListener("mousedown",()=>keys[k]=true);b.addEventListener("mouseup",()=>keys[k]=false);b.addEventListener("mouseleave",()=>keys[k]=false)}
btnCtrl(document.getElementById("left"),"left");btnCtrl(document.getElementById("right"),"right");
function jump(){if(playing&&!dead&&onGround){vy=jumpPower;onGround=false}}
document.getElementById("jump").addEventListener("touchstart",e=>{e.preventDefault();jump()});document.getElementById("jump").addEventListener("mousedown",jump);
document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")keys.left=true;if(e.key==="ArrowRight")keys.right=true;if(e.key==="ArrowUp"||e.key===" ")jump()});
document.addEventListener("keyup",e=>{if(e.key==="ArrowLeft")keys.left=false;if(e.key==="ArrowRight")keys.right=false});
function startGame(){document.getElementById("start").style.display="none";playing=true;restartPlayer()}
function restartPlayer(){x=70;y=187;vx=0;vy=0;onGround=true;dead=false;coins=0;document.getElementById("coins").textContent="0/3";document.getElementById("message").style.display="none";document.getElementById("c1").style.display="flex";document.getElementById("c2").style.display="flex";document.getElementById("c3").style.display="flex";document.getElementById("c1").classList.remove("collected");document.getElementById("c2").classList.remove("collected");document.getElementById("c3").classList.remove("collected");document.getElementById("trollPlatform").classList.remove("falling","fake");document.getElementById("hiddenSpike1").style.display="none";document.getElementById("fakeDoor").style.display="block";document.getElementById("realDoor").style.display="none"}
function restart(){restartPlayer()}
function shake(){game.classList.add("shake");setTimeout(()=>game.classList.remove("shake"),300)}
function die(msg){if(dead)return;dead=true;shake();document.getElementById("messageTitle").textContent="💀 وقعت في الفخ!";document.getElementById("messageText").textContent=msg;document.getElementById("message").style.display="flex"}
function win(){if(dead)return;dead=true;document.getElementById("messageTitle").textContent="🎉 يا غشاش!";document.getElementById("messageText").textContent="عديت أول فخ.. اللي جاي أصعب بكتير 😈";document.getElementById("message").style.display="flex"}
function checkCollisions(){
 if(x+30>300&&x<380&&Math.abs(y-187)<40) die("الشوك ده كان باين يا نوب 😂");
 if(x+30>580&&x<620&&y<260&&y>180){
   if(document.getElementById("c1").style.display!=="none"){document.getElementById("c1").classList.add("collected");setTimeout(()=>document.getElementById("c1").style.display="none",200);coins++;document.getElementById("coins").textContent=coins+"/3"}
 }
 if(x+30>990&&x<1050&&y>250&&y<360){
   if(document.getElementById("c2").style.display!=="none"){die("قولتلك متثقش في العملة الغريبة! دي كانت فخ 💀");document.getElementById("hiddenSpike1").style.display="block"}
 }
 if(x+30>1360&&x<1420&&y<260&&y>180){
   if(document.getElementById("c3").style.display!=="none"){document.getElementById("c3").classList.add("collected");setTimeout(()=>document.getElementById("c3").style.display="none",200);coins++;document.getElementById("coins").textContent=coins+"/3";if(coins>=2){document.getElementById("fakeDoor").style.display="none";document.getElementById("realDoor").style.display="block"}}
 }
 // منصة الفخ
 if(x>880&&x<1180&&y>230&&y<300){
   if(!platformTimer){document.getElementById("trollPlatform").classList.add("fake");platformTimer=setTimeout(()=>{document.getElementById("trollPlatform").classList.add("falling");die("المنصة دي كانت فخ.. وقعت بيك 😈");platformTimer=null},600)}
 } else { if(platformTimer){clearTimeout(platformTimer);platformTimer=null;document.getElementById("trollPlatform").classList.remove("fake")} }
 if(x>2140&&x<2215&&y>210&&y<340) win();
 if(x>1950&&x<2025&&y>210&&y<340&&document.getElementById("fakeDoor").style.display!=="none") die("ده باب مزيف يا ذكي.. الباب الحقيقي مستخبي 😂");
}
function update(){
 if(playing&&!dead){
   if(keys.left) vx=-speed; else if(keys.right) vx=speed; else vx*=0.78;
   x+=vx; vy-=gravity; y+=vy;
   if(y<=187){y=187;vy=0;onGround=true}
   if(x<0)x=0; if(x>2500)x=2500;
   if(y<-150) die("وقعت في الفراغ!");
   player.style.left=x+"px";player.style.bottom=y+"px";
   const sw=window.innerWidth,camX=Math.max(0,Math.min(x-sw*0.35,2600-sw));
   world.style.transform="translateX(-"+camX+"px)";
   checkCollisions();
 }
 requestAnimationFrame(update);
}
update();
</script>
</body>
                                                                                                                                                 </html>
